        // 2つの緯度・経度間の大圏距離(メートル)を算出
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        async function fetchOSMData(type, center, radius = 500, keyword = '') {
            const lat = center.lat;
            const lon = center.lng;
            let query = "";
            let emoji = "📍";
            let color = "#333";

            // Overpass QL標準の「nwr（nodes, ways, relations）」短縮セレクタを使用し、クエリ効率と正確性を最大化
            const categories = {
                'parks': { q: 'nwr["leisure"="park"](around:RADIUS,LAT,LON);', e: '🌳', c: '#2e7d32' },
                'stations': { q: 'nwr["railway"="station"](around:RADIUS,LAT,LON);', e: '🚉', c: '#1565c0' },
                'toilets': { q: 'nwr["amenity"="toilets"](around:RADIUS,LAT,LON);', e: '🚻', c: '#f57c00' },
                'shops': { q: 'nwr["shop"="convenience"](around:RADIUS,LAT,LON);', e: '🏪', c: '#43a047' },
                'parking': { q: 'nwr["amenity"="parking"](around:RADIUS,LAT,LON);', e: '🅿️', c: '#546e7a' },
                'cafe': { q: 'nwr["amenity"="cafe"](around:RADIUS,LAT,LON);', e: '☕', c: '#6d4c41' },
                'vending': { q: 'nwr["amenity"="vending_machine"](around:RADIUS,LAT,LON);', e: '🥤', c: '#1e88e5' }
            };

            if (type === 'all') {
                query = Object.values(categories).map(cat => cat.q).join('');
            } else if (categories[type]) {
                query = categories[type].q;
                emoji = categories[type].e;
                color = categories[type].c;
            }

            query = query.replace(/RADIUS/g, radius).replace(/LAT/g, lat).replace(/LON/g, lon);

            document.getElementById('loading-overlay').classList.remove('hidden');

            try {
                let data = null;
                let lastError = null;

                // 1. キャッシュの検索（位置情報、半径、タイプが近しいものをLocalStorageから探す）
                const cacheKey = `map-osm-cache-${type}-${radius}-${lat.toFixed(4)}-${lon.toFixed(4)}`;
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (parsed && parsed.timestamp && (Date.now() - parsed.timestamp < 15 * 60 * 1000)) {
                            data = parsed.data;
                            console.log("Cached Overpass data used successfully.");
                        }
                    } catch (e) {
                        console.warn("Cache parse error", e);
                    }
                }

                // 2. キャッシュがない場合、エンドポイントを巡回してフェッチ（自動リトライ＆フォールバック）
                if (!data) {
                    for (const endpoint of overpassEndpoints) {
                        try {
                            const url = `${endpoint}?data=[out:json];(${query});out center;`;
                            const res = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : null });
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            data = await res.json();
                            if (data && data.elements) {
                                // キャッシュに保存
                                localStorage.setItem(cacheKey, JSON.stringify({
                                    timestamp: Date.now(),
                                    data: data
                                }));
                                break; // 成功したらループを抜ける
                            }
                        } catch (err) {
                            console.warn(`Endpoint ${endpoint} failed:`, err);
                            lastError = err;
                        }
                    }
                }

                let elements = [];
                let isFallbackUsed = false;

                if (data && data.elements) {
                    elements = data.elements;
                } else {
                    console.error("すべてのOverpassエンドポイントで取得失敗。ローカル代替データを読み込みます。:", lastError);
                    isFallbackUsed = true;
                    // 範囲内のローカルフォールバックデータをフィルター
                    elements = localFallbackFacilities.filter(f => {
                        const dist = getDistance(lat, lon, f.pos[0], f.pos[1]);
                        if (dist > radius) return false;
                        if (type !== 'all' && f.type !== type) return false;
                        return true;
                    }).map(f => ({
                        type: "node",
                        id: Math.random(),
                        lat: f.pos[0],
                        lon: f.pos[1],
                        tags: {
                            name: f.name,
                            ...f.tags
                        }
                    }));
                }

                markers.clearLayers();
                foundFacilities = [];
                const listContainer = document.getElementById('facility-list');
                listContainer.innerHTML = '';

                if (keyword) {
                    elements = elements.filter(el => {
                        const name = (el.tags && el.tags.name) || '';
                        return name.includes(keyword);
                    });
                }

                elements.forEach(el => {
                    let mEmoji = emoji;
                    let mColor = color;
                    const pos = el.center ? [el.center.lat, el.center.lon] : [el.lat, el.lon];
                    const tags = el.tags || {};
                    const name = tags.name || tags.operator || "名称不明の施設";

                    if (type === 'all') {
                        if (tags.leisure === 'park') { mEmoji = "🌳"; mColor = "#2e7d32"; }
                        else if (tags.railway === 'station') { mEmoji = "🚉"; mColor = "#1565c0"; }
                        else if (tags.amenity === 'toilets') { mEmoji = "🚻"; mColor = "#f57c00"; }
                        else if (tags.shop && tags.shop.includes('convenience')) { mEmoji = "🏪"; mColor = "#43a047"; }
                        else if (tags.amenity === 'parking') { mEmoji = "🅿️"; mColor = "#546e7a"; }
                        else if (tags.amenity === 'cafe') { mEmoji = "☕"; mColor = "#6d4c41"; }
                        else if (tags.amenity === 'vending_machine') { mEmoji = "🥤"; mColor = "#1e88e5"; }
                    }

                    const marker = L.marker(pos, { icon: createIcon(mEmoji, mColor) });
                    let info = `<div class="p-2 min-w-[150px]"><b class="text-lg block mb-1">${name}</b>`;
                    if (tags.leisure === 'park') info += `<div class="text-sm mb-1">♿ バリアフリー: ${tags.wheelchair==='yes'?'✅':'❓'}</div>`;

                    const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}`;
                    info += `<a href="${routeUrl}" target="_blank" class="block text-center bg-blue-500 text-white text-xs font-bold py-1 px-2 rounded mt-2">🚗 ルート</a></div>`;

                    marker.bindPopup(info);
                    marker.addTo(markers);

                    // リストアイテムの作成
                    const item = document.createElement('div');
                    item.className = 'facility-item';
                    item.innerHTML = `
                        <div class="flex items-start gap-3">
                            <div class="text-xl">${mEmoji}</div>
                            <div class="flex-grow">
                                <div class="font-bold">${name}</div>
                                <div class="text-xs text-gray-500">${tags.operator || ''}</div>
                                <div class="mt-2 flex gap-2">
                                    <button class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded" onclick="window.focusFacility(${pos[0]}, ${pos[1]})">地図で見る</button>
                                    <a href="${routeUrl}" target="_blank" class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">ルート</a>
                                </div>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(item);
                });

                document.getElementById('count').textContent = elements.length;
                if (elements.length === 0) {
                    listContainer.innerHTML = '<div class="p-8 text-center text-gray-400">見つかりませんでした</div>';
                }

                if (window.radiusCircle) map.removeLayer(window.radiusCircle);
                window.radiusCircle = L.circle([lat, lon], {
                    radius: radius, color: '#8BC34A', fillColor: '#8BC34A', fillOpacity: 0.1, dashArray: '5, 10'
                }).addTo(map);

            } catch (e) {
                console.error("OSMデータの取得に失敗:", e);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        window.focusFacility = (lat, lon) => {
            map.setView([lat, lon], 17);
            markers.eachLayer(m => {
                if (m.getLatLng().lat === lat && m.getLatLng().lng === lon) m.openPopup();
            });
            if (window.innerWidth <= 768) toggleSidePanel();
        };

        const executeSearch = () => {
            const radius = parseInt(document.getElementById('radius-select').value);
            const keyword = document.getElementById('keyword-input').value;
            fetchOSMData(currentType, map.getCenter(), radius, keyword);
        };

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentType = chip.dataset.type;
                executeSearch();
            });
        });

        document.getElementById('radius-select').addEventListener('change', executeSearch);
        document.getElementById('search-btn').addEventListener('click', executeSearch);
        document.getElementById('keyword-input').addEventListener('keypress', e => { if(e.key === 'Enter') executeSearch(); });

        document.getElementById('locate-btn').addEventListener('click', () => {
            map.locate({setView: true, maxZoom: 16});
        });

        let userLocationMarker = null;
        map.on('locationfound', (e) => {
            if (userLocationMarker) map.removeLayer(userLocationMarker);
            userLocationMarker = L.marker(e.latlng, { icon: createIcon('🚶', '#F44336') }).addTo(map)
                .bindPopup("<b>現在地</b>").openPopup();
            executeSearch();
        });

        const toggleSidePanel = () => {
            const panel = document.getElementById('side-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('open');
        };

        document.getElementById('toggle-list-btn').addEventListener('click', toggleSidePanel);
        document.getElementById('close-list-btn').addEventListener('click', toggleSidePanel);

        map.whenReady(() => {
            executeSearch();
        });
    </script>
    <footer>
        <div class="max-w-6xl mx-auto px-6">
            <div class="footer-logo">SAITAMA PARKS</div>
            <hr>
            <p class="text-sm opacity-80">© 2026 埼玉県公園ガイドポータル - 自然と共に生きる。</p>
            <div class="footer-links mt-8 flex justify-center gap-8 text-sm flex-wrap">
                <a onclick="openModal('about')" class="cursor-pointer">サイトについて</a>
                <a onclick="openModal('access')" class="cursor-pointer">アクセス</a>
                <a onclick="openModal('legal')" class="cursor-pointer">利用規約</a>
                <a onclick="openModal('copyright')" class="cursor-pointer">著作権</a>
            </div>
        </div>
    </footer>

    <script defer src="js/common.js" defer></script>
</body>
</html>
